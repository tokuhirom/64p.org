<!doctype html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mutsu - 令和の時代に JIT 搭載の Raku インタープリタを実装した話</title>
    <link href="../assets/presen5/presen5.css" rel="stylesheet" type="text/css" media="all" />
    <style>
      /* 英語話者向けの字幕。add-english.py が main.txt に入れる */
      #topics .en { position:fixed; left:0; right:0; bottom:0; padding:10px 24px 14px; font-size:24px; line-height:1.4; color:#555; background:rgba(245,245,245,.94); border-top:1px solid #ddd; text-align:center; font-weight:normal; font-family: "Helvetica Neue", Arial, sans-serif; }
      #topics .en code { font-size:100%; }
      /* PDF（印刷）用: 字幕は本文の下に小さくグレーで */
      /* デモの iframe は印刷に出ないので、PDF では代わりに静止画 (gen-demo-shots.js) を出す */
      #topics .print-only { display:none; }
      .print_topics iframe { display:none; }
      .print_topics .print-only { display:block; max-width:100%; max-height:120mm; margin:0 auto; border:1px solid #ddd; }
      .print_topics .en { display:block; margin-top:.8em; font-size:42%; line-height:1.4; color:#666; font-weight:normal; font-family: "Helvetica Neue", Arial, sans-serif; }
      /* 余白は文字サイズに比例させる（fit.js が文字サイズを縮めたときに余白だけ残らないように） */
      #topics ul li { margin-bottom: .3em; }
      #topics h3 { padding: .2em; }
      /* presen5 は pre の文字サイズを画面幅から px で上書きするので、本文に比例させて折り返す */
      #topics pre { font-size: .55em !important; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all; overflow-x: visible; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="title">SectionTitlePlaceHolder</div>
            <div id="page_info">
                <span id="time">TIME</span> <span id="used_time">rest time</span> <span id="current_page">current</span>/<span id="total_page">total</span>
            </div>
        </div>

        <div id="topics">TopicsPlaceHolder</div>
    </div>

    <div id="padding"></div>

    <script type="text/javascript" src="../assets/jquery-3.7.1.min.js"></script>
    
<script type="text/javascript" src="../assets/presen5/presen5.js"></script>
<script type="text/javascript" src="fit.js"></script>
</body>
</html>
